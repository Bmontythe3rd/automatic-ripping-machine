# Docker Compose for Automatic Ripping Machine (fork)
#
# Host OS: any modern Linux server with Docker (Ubuntu 22.04–26.04, Debian, etc.).
# Prep once: sudo ./scripts/installers/prepare-host.sh
# See docs/host-compatibility.md
#
# Quick start (UI on laptop or server):
#   mkdir -p data/{home,config,logs,media,music}
#   cp -n setup/arm.yaml setup/apprise.yaml data/config/
#   cp -n setup/.abcde.conf data/config/abcde.conf
#   sudo chown -R "$(id -u):$(id -g)" data
#   export ARM_UID=$(id -u) ARM_GID=$(id -g) ARM_HOME=$PWD/data
#   docker compose up -d --build
#   open http://localhost:8080  (admin / password)
#
# For real ripping, uncomment the devices: and udev volume lines below.
# For NVIDIA HW encode:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#   See docs/hardware-transcode.md
# For NAS media/music under /mnt (generates docker-compose.nas.yml):
#   ./scripts/installers/configure-storage.sh
#   docker compose -f docker-compose.yml -f docker-compose.nas.yml up -d
#   See docs/storage-and-sftp.md
# For Intel/AMD, uncomment /dev/dri examples at the bottom of this file.

services:
  arm:
    build: .
    image: arm-fork:local
    container_name: arm-rippers
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    environment:
      - ARM_UID=${ARM_UID:-1000}
      - ARM_GID=${ARM_GID:-1000}
      - TZ=${TZ:-UTC}
      # Set to 1 if disc inserts are not detected via udev inside Docker
      - ARM_DRIVE_POLL=${ARM_DRIVE_POLL:-0}
      # Optional: persist Flask secret across recreates
      # - ARM_SECRET_KEY=change-me
    volumes:
      - ${ARM_HOME:-./data}/home:/home/arm
      - ${ARM_HOME:-./data}/config:/etc/arm/config
      - ${ARM_HOME:-./data}/logs:/home/arm/logs
      - ${ARM_HOME:-./data}/media:/home/arm/media
      - ${ARM_HOME:-./data}/music:/home/arm/music
      # Uncomment for reliable drive detection when ripping:
      # - /run/udev:/run/udev:ro
      # - /dev/disk:/dev/disk:ro
    # Uncomment optical drives when present:
    # devices:
    #   - /dev/sr0:/dev/sr0

  # --- Optional HW encode overlays (compose profiles) ---
  # docker compose --profile gpu-intel up -d
  # Merges with the arm service via YAML anchors are awkward in Compose v2;
  # instead, uncomment the matching block under services.arm when needed, or:
  # use the examples below as reference for devices/environment.

# Example Intel QuickSync / AMD VCN (add under services.arm):
#    devices:
#      - /dev/dri:/dev/dri
#    group_add:
#      - video
#      - render
#
# Example NVIDIA NVENC (add under services.arm):
#    environment:
#      - NVIDIA_DRIVER_CAPABILITIES=all
#      - NVIDIA_VISIBLE_DEVICES=all
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
#
# Or: docker run --gpus all ... with NVIDIA Container Toolkit installed.

{% extends "support/base_simple.html" %}

{% block content %}
<div class="arm-login-page">
    <div class="arm-login-card">
        <div class="arm-login-brand">
            <img src="{{ url_for('static', filename='img/arm80.png') }}" alt="ARM">
            <h1>Automatic Ripping Machine</h1>
            <p>Sign in to manage rips and drives</p>
        </div>
        <form id="form1" name="form1" method="post" action="login">
            {{ form.hidden_tag() }}
            <label class="arm-label" for="login-username">Username</label>
            <input id="login-username" type="text" class="form-control" name="username"
                   placeholder="admin" value="" autocomplete="username">
            {% for error in form.username.errors %}
                <div class="text-danger">{{ error }}</div>
            {% endfor %}
            <label class="arm-label" for="login-password">Password</label>
            <input id="login-password" type="password" class="form-control" name="password"
                   autocomplete="current-password">
            {% for error in form.password.errors %}
                <div class="text-danger">{{ error }}</div>
            {% endfor %}
            <input class="form-control" name="save" value="save" hidden>
            <button class="btn btn-primary btn-lg btn-block" form="form1" type="submit">Login</button>
        </form>
    </div>
</div>
{% endblock %}

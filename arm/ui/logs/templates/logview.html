{% extends "base.html" %}

{% block content %}
<header class="arm-page-hero">
    <h1>Log viewer</h1>
    <p class="arm-mono">{{ file }}</p>
</header>
<div class="arm-panel">
    <div id="log">
        <pre id="{{ file }}" class="arm-mono mb-0" style="white-space: pre-wrap; word-break: break-word; max-height: 70vh; overflow: auto;"></pre>
    </div>
</div>
{% endblock %}
{% block footer %}{{ super() }}{% endblock %}
{% block js %}
{{ super() }}
<script>
    const output = document.getElementById('{{ file }}');

    const xhr = new XMLHttpRequest();
    {% if mode == 'tail' or mode == 'full' %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode=full&json=1');
    {% else %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode={{ mode }}&json=1');
    {% endif %}
    xhr.send();

    setInterval(function() {
        output.textContent = xhr.responseText;
        {% if mode == 'tail' %}
            window.scrollTo(0, document.querySelector("#content").scrollHeight);
        {% endif %}
    }, 1000);
</script>
{% endblock %}
